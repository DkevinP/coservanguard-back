name: Deploy Spring Boot API
on:
  push:
    branches: [ "main" ] # Cambia a 'master' si esa es tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto con Maven
        run: mvn clean package -DskipTests -Dfile.encoding=UTF-8

      - name: Copy JAR to Azure
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "target/*.jar"
          target: "/opt/proyecto-api/"
          strip_components: 1

      - name: Restart Systemd Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Renombrar el jar generado a api.jar
            mv /opt/proyecto-api/*.jar /opt/proyecto-api/api.jar
            # Reiniciar el servicio que creamos antes
            sudo systemctl restart coservanguard.service